# Même source, mêmes octets : rien dont l'ordre de parcours dépende de l'hôte.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "ordre de parcours non déterministe : employer BTreeMap" },
    { path = "std::collections::HashSet", reason = "ordre de parcours non déterministe : employer BTreeSet" },
]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
