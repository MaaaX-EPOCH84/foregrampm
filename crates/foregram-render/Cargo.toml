[package]
name = "foregram-render"
description = "Rendering of a ForegramPM layout: SVG, and PNG through an integer rasteriser."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Only the PNG brings a dependency: without the feature, the crate has none.
png = ["dep:png"]

[dependencies]
foregram-graph = { path = "../foregram-graph" }
# PNG encoding: chunks, CRC, deflate. The image is already rasterised here.
png = { version = "0.18.1", optional = true }

[dev-dependencies]
# The tests read the produced PNG back.
png = "0.18.1"

[lints]
workspace = true
