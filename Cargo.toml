[workspace]
resolver = "3"
members = [
    "crates/foregram-graph",
    "crates/foregram-render",
    "crates/foregram-source",
    "crates/foregram",
    "crates/foregram-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Maxime MARCONATO (MaaaX / EPOCH84)"]
license = "GPL-3.0-or-later"
repository = "https://github.com/MaaaX-EPOCH84/foregrampm"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# No abrupt stop: every failure is a value returned to the caller.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
